[project]
name = "ethiopian-bongo-telegram-bot"
version = "0.1.0"
description = "Free-play Traditional Ethiopian Bongo games for Telegram groups"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot[job-queue]>=22.8,<23",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
